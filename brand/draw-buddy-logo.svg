<!--
  Draw Buddy official logo: Concept 2, the arcade marquee.
  Andrew picked this mark; Ralph has cleared it.
  Wordmark: IBM Plex Mono Bold (SIL Open Font License 1.1), converted to outlines.
  Font source: https://raw.githubusercontent.com/IBM/plex/master/packages/plex-mono/fonts/complete/ttf/IBMPlexMono-Bold.ttf
  The coin has a friendly smirk (right corner lifted) and a cyan left eye
  plus a pink right eye. No dollar signs, numerals, reels, or jackpot wording.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
