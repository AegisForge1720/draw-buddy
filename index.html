<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="format-detection" content="telephone=no">
  <title>Draw Buddy</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --fg: #f4f7fb;
      --muted: #a8b3c7;
      --accent: #8eb7ff;
      --line: rgba(255, 255, 255, 0.12);
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; height: 100%; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--fg);
      background:
        radial-gradient(900px 420px at 50% -80px, #24345c 0%, transparent 70%),
        var(--bg);
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 1.5rem;
    }

    main {
      width: min(34rem, 100%);
      text-align: center;
    }

    .name {
      margin: 0 0 1.25rem;
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 650;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 10vw, 3.75rem);
      font-weight: 700;
      letter-spacing: -0.035em;
      line-height: 1.05;
    }

    .lede {
      margin: 1.1rem auto 0;
      max-width: 28rem;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.55;
    }

    footer {
      margin-top: 2.75rem;
      padding-top: 1.15rem;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.5;
    }

    footer p { margin: 0.35rem 0; }

    .nowrap { white-space: nowrap; }
  </style>
</head>
<body>
  <main>
    <p class="name">Draw Buddy</p>
    <h1>Coming soon</h1>
    <p class="lede">A lottery stats and number-tracking app for adults. Launching soon on iOS and Android.</p>
    <footer>
      <p>18+ only. Draw Buddy does not sell lottery tickets or accept wagers.</p>
      <p>Gambling problem? Call <span class="nowrap">1-877-8-HOPENY</span> <span class="nowrap">(1-877-846-7369)</span> or text HOPENY <span class="nowrap">(467369)</span>.</p>
      <p>© 2026 NAV Analytics LLC</p>
    </footer>
  </main>
</body>
</html>
