<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Draw Buddy - Live Quick Draw Tactical Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #070b19; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .number-ball {
            width: 42px; height: 42px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 9999px; font-weight: 800; font-size: 1.1rem;
            transition: all 0.2s ease-in-out;
        }
        .ball-active { background: linear-gradient(135deg, #facc15, #ca8a04); color: #070b19; box-shadow: 0 0 15px rgba(250, 204, 21, 0.5); border: 1px solid #fef08a; }
        .ball-inactive { background: #111c38; color: #60a5fa; border: 1px solid #1d4ed8; }
        .ball-hit { background: linear-gradient(135deg, #10b981, #059669); color: white; box-shadow: 0 0 15px rgba(16, 185, 129, 0.5); border: 1px solid #34d399; }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- Header & Tactical Status Bar -->
    <header class="bg-[#0b132b] border-b border-[#1d4ed8] sticky top-0 z-50 shadow-xl">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="w-3 h-3 bg-yellow-400 rounded-full animate-pulse shadow-[0_0_8px_#facc15]"></div>
                <h1 class="font-black text-lg tracking-wider text-white">DRAW <span class="text-yellow-400">BUDDY</span></h1>
            </div>
            <div id="sync-status" class="text-xs px-2.5 py-1 rounded bg-[#070b19] text-yellow-400 border border-[#1d4ed8]">Connecting...</div>
        </div>

        <!-- Live Game & Block Status Ticker -->
        <div class="bg-[#050814] border-t border-[#1d4ed8] px-4 py-2 text-xs">
            <div class="max-w-md mx-auto grid grid-cols-3 gap-2 text-center">
                <div class="bg-[#0b132b]/90 p-1.5 rounded border border-[#1e3a8a]">
                    <div class="text-blue-400 uppercase tracking-wider text-[10px]">Current Draw</div>
                    <div id="header-curr-draw" class="font-bold text-white text-sm">#--</div>
                </div>
                <div class="bg-[#0b132b]/90 p-1.5 rounded border border-[#1e3a8a]">
                    <div class="text-blue-400 uppercase tracking-wider text-[10px]">Next Target</div>
                    <div id="header-next-draw" class="font-bold text-yellow-400 text-sm">#--</div>
                </div>
                <div class="bg-[#0b132b]/90 p-1.5 rounded border border-[#1e3a8a]">
                    <div class="text-blue-400 uppercase tracking-wider text-[10px]">Session Block</div>
                    <div id="header-block-status" class="font-bold text-cyan-400 text-sm">0 / 200</div>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 mt-4 space-y-4">

        <!-- One-Tap Preset Bar Modes -->
        <div class="bg-[#0b132b] p-4 rounded-xl border border-[#1d4ed8] shadow-xl">
            <h2 class="text-xs uppercase tracking-wider text-yellow-400 font-semibold mb-2.5">⚡ Bar Presets</h2>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="applyPreset('sweet_spot')" class="bg-gradient-to-r from-yellow-400 to-amber-500 hover:from-yellow-300 hover:to-amber-400 text-slate-950 p-2.5 rounded-lg font-black text-xs shadow-md transition flex flex-col items-center justify-center">
                    <span>🎯 The Sweet Spot</span>
                    <span class="text-[10px] text-slate-900 font-bold mt-0.5">10-Spot | 100 Lookback | 200 Games</span>
                </button>
                <button onclick="applyPreset('quick_session')" class="bg-[#111c38] hover:bg-[#1e293b] text-yellow-300 border border-yellow-500/30 p-2.5 rounded-lg font-bold text-xs shadow-md transition flex flex-col items-center justify-center">
                    <span>⚡ Quick Session</span>
                    <span class="text-[10px] text-blue-300 font-normal mt-0.5">10-Spot | 100 Lookback | 25 Games</span>
                </button>
            </div>
        </div>

        <!-- Configuration Panel -->
        <div class="bg-[#0b132b] p-4 rounded-xl border border-[#1d4ed8] shadow-xl space-y-3">
            <h2 class="text-xs uppercase tracking-wider text-yellow-400 font-semibold">⚙️ Session Parameters</h2>
            
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs text-blue-300 mb-1">Spot Tier (1-10)</label>
                    <select id="spot-tier" class="w-full bg-[#050814] border border-[#1d4ed8] rounded-lg p-2 text-sm font-bold text-yellow-400 focus:outline-none focus:border-yellow-400">
                        <option value="1">1-Spot</option><option value="2">2-Spot</option><option value="3">3-Spot</option>
                        <option value="4">4-Spot</option><option value="5">5-Spot</option><option value="6">6-Spot</option>
                        <option value="7">7-Spot</option><option value="8">8-Spot</option><option value="9">9-Spot</option>
                        <option value="10" selected>10-Spot (+12.5% ROI)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-blue-300 mb-1">Lookback Draws</label>
                    <input type="number" id="lookback-draws" value="100" class="w-full bg-[#050814] border border-[#1d4ed8] rounded-lg p-2 text-sm font-bold text-cyan-300 focus:outline-none focus:border-yellow-400">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs text-blue-300 mb-1">Game Block Size</label>
                    <input type="number" id="game-block" value="200" class="w-full bg-[#050814] border border-[#1d4ed8] rounded-lg p-2 text-sm font-bold text-yellow-300 focus:outline-none focus:border-yellow-400">
                </div>
                <div>
                    <label class="block text-xs text-blue-300 mb-1">Wager ($/game)</label>
                    <input type="text" value="$2 ($1 Base + $1 Extra)" disabled class="w-full bg-[#050814]/50 border border-[#1e3a8a] rounded-lg p-2 text-xs text-blue-400 cursor-not-allowed">
                </div>
            </div>

            <button onclick="generateTicket()" class="w-full bg-gradient-to-r from-yellow-400 to-amber-500 hover:from-yellow-300 hover:to-amber-400 text-slate-950 font-black py-3 px-4 rounded-xl shadow-lg transition tracking-wide text-sm">
                🚀 GENERATE OPTIMAL TICKET
            </button>
        </div>

        <!-- Actionable Play Card -->
        <div id="play-card" class="bg-[#0b132b] p-5 rounded-xl border border-yellow-500/40 shadow-2xl space-y-4 hidden">
            <div class="flex justify-between items-center border-b border-[#1d4ed8] pb-3">
                <div>
                    <div class="text-[10px] uppercase tracking-wider text-yellow-400 font-semibold">Active Action Plan</div>
                    <div id="card-draw-label" class="text-lg font-black text-white">Target Draw #-------</div>
                </div>
                <div class="text-right">
                    <div class="text-[10px] uppercase tracking-wider text-blue-400 font-semibold">Investment</div>
                    <div id="card-cost-label" class="text-sm font-bold text-yellow-300">$2.00 / game</div>
                </div>
            </div>

            <div>
                <div class="text-xs text-blue-300 mb-2 font-medium">Optimal Numbers to Play:</div>
                <div id="number-grid" class="grid grid-cols-5 gap-2.5 py-1">
                    <!-- Numbers rendered dynamically -->
                </div>
            </div>

            <div class="bg-[#050814] p-3 rounded-lg border border-[#1d4ed8] text-xs space-y-1">
                <div class="flex justify-between"><span class="text-blue-300">Strategy Lookback:</span> <span id="stat-lookback" class="font-bold text-white">100 Draws</span></div>
                <div class="flex justify-between"><span class="text-blue-300">Session Budget:</span> <span id="stat-budget" class="font-bold text-yellow-300">$400.00 (200 games)</span></div>
            </div>

            <button onclick="logTicketToCloud()" class="w-full bg-[#111c38] hover:bg-[#1e293b] text-yellow-400 border border-yellow-500/40 font-bold py-2.5 px-4 rounded-lg shadow transition text-xs flex items-center justify-center space-x-2">
                <span>☁️ Log Ticket to Cloud & Advance Block</span>
            </button>
        </div>

        <!-- 📸 Bar Ticket Scanner & Winner Verification Module -->
        <div class="bg-[#0b132b]
