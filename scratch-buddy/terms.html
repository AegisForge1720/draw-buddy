<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>Scratch Buddy — Terms (draft)</title>
    <link rel="stylesheet" href="./css/app.css">
</head>
<body data-legal-page="terms">
    <script>
        try {
            var agePass = JSON.parse(localStorage.getItem("scratch_buddy_age_gate") || "null");
            if (agePass && agePass.flag === "18plus" && !agePass.dob && !agePass.dateOfBirth && agePass.expiresAt > Date.now()) {
                document.documentElement.classList.add("age-cleared");
            }
        } catch (error) {}
    </script>
    <div id="age-gate" role="dialog" aria-modal="true" aria-labelledby="age-gate-title">
        <div class="age-card">
            <p class="age-kicker">Age check</p>
            <h2 id="age-gate-title">Scratch Buddy is for adults 18 and over</h2>
            <p>Enter your date of birth to continue.</p>
        </div>
    </div>
    <div id="app-shell" inert></div>
    <footer class="site-footer">
        <p>Scratch Buddy is an independent app from NAV Analytics LLC. It is not affiliated with, endorsed by, or sponsored by the New York Lottery or the New York State Gaming Commission.</p>
    </footer>
    <script type="module" src="./js/legal-page.js"></script>
</body>
</html>
